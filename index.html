<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapFolder — Interactive Markdown Mind Maps</title>
  <meta name="description" content="Turn your markdown folder into interactive, shareable mind maps with full RTL and theme support.">

  <!-- Favicon as SVG data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 3v18h18'/><circle cx='9' cy='9' r='2'/><circle cx='17' cy='7' r='2'/><circle cx='15' cy='15' r='2'/><path d='M9 9l8-2'/><path d='M9 9l6 6'/></svg>">

  <!-- Google Fonts: Outfit for English/Latin, Tajawal for Arabic/RTL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- markmap-toolbar Stylesheet (Pinned version 0.18.12) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/style.css">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- App Layout Container -->
  <div class="app-layout" id="appLayout">

    <!-- Mobile Backdrop for Sidebar Drawer -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Mind maps navigation">
      <!-- Sidebar Header & Brand -->
      <header class="sidebar-header">
        <a href="#/" class="brand-link" id="brandLink" title="MapFolder Home">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="6" r="3"/>
              <circle cx="18" cy="18" r="3"/>
              <path d="M8.7 10.7l6.6-3.4"/>
              <path d="M8.7 13.3l6.6 3.4"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">MapFolder</span>
            <span class="brand-badge">Viewer</span>
          </div>
        </a>
        <button type="button" class="btn-icon mobile-only close-sidebar-btn" id="btnCloseSidebar" aria-label="Close navigation sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- Search Box with Clear Button -->
      <div class="sidebar-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="search" 
            id="mapSearchInput" 
            class="search-input" 
            placeholder="Search maps..." 
            aria-label="Search maps by title or path"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="btnClearSearch" class="btn-clear-search" aria-label="Clear search text" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Tree Navigation -->
      <nav class="tree-nav-container" id="treeNavContainer" aria-label="Maps tree view">
        <div class="tree-root" id="treeRoot" role="tree" tabindex="0">
          <!-- Tree nodes dynamically inserted here -->
        </div>
        <div class="tree-no-results" id="treeNoResults" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <p>No matching maps found</p>
        </div>
      </nav>

      <!-- Sidebar Footer -->
      <footer class="sidebar-footer">
        <div class="footer-stats" id="footerStats">
          <span id="mapsCountBadge" class="stats-badge">0 maps</span>
        </div>
        <div class="footer-actions">
          <button type="button" id="btnToggleAllFolders" class="btn-footer-action" title="Toggle all folders" aria-label="Toggle all folders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
          <a href="https://github.com/markmap/markmap" target="_blank" rel="noopener noreferrer" class="btn-footer-action" title="Powered by Markmap (MIT License)" aria-label="Markmap GitHub repository">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
            </svg>
          </a>
        </div>
      </footer>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">

      <!-- Top Header / App Bar -->
      <header class="top-header" id="topHeader">
        <div class="header-left">
          <!-- Mobile Hamburger Toggle -->
          <button type="button" class="btn-icon mobile-only" id="btnOpenSidebar" aria-label="Open navigation sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- Current Map Title and Path Breadcrumbs -->
          <div class="map-meta">
            <span class="map-path" id="mapPathBreadcrumb">maps/</span>
            <h1 class="map-title" id="mapTitleHeading">Loading map...</h1>
          </div>
        </div>

        <!-- Action Controls & Toolbar -->
        <div class="header-actions">
          <!-- Zoom Controls -->
          <div class="action-group" role="group" aria-label="Zoom controls">
            <button type="button" class="btn-action" id="btnZoomOut" title="Zoom out (-)" aria-label="Zoom out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
            <button type="button" class="btn-action" id="btnZoomIn" title="Zoom in (+)" aria-label="Zoom in">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
              </svg>
            </button>
            <button type="button" class="btn-action" id="btnFit" title="Fit to screen (0)" aria-label="Fit to screen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
          </div>

          <!-- Tree View Depth Controls (Expand / Collapse All) -->
          <div class="action-group" role="group" aria-label="Tree expansion controls">
            <button type="button" class="btn-action" id="btnToggleExpand" title="Expand or collapse all branches" aria-label="Expand or collapse all branches">
              <svg id="iconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <!-- Branches expanding icon -->
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span class="btn-text-responsive" id="expandToggleText">Expand All</span>
            </button>
          </div>

          <!-- Utility Controls (Source, SVG Download, Theme) -->
          <div class="action-group" role="group" aria-label="Map utilities">
            <button type="button" class="btn-action" id="btnViewSource" title="View Markdown source" aria-label="View Markdown source">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              <span class="btn-text-responsive">Source</span>
            </button>

            <button type="button" class="btn-action" id="btnDownloadSvg" title="Download mind map as SVG" aria-label="Download mind map as SVG">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span class="btn-text-responsive">SVG</span>
            </button>

            <button type="button" class="btn-action btn-theme-toggle" id="btnThemeToggle" title="Toggle theme (Light / Dark)" aria-label="Toggle dark and light theme">
              <!-- Sun icon for dark mode (click to switch to light) -->
              <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <!-- Moon icon for light mode (click to switch to dark) -->
              <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Mind Map Viewport Container -->
      <div class="mindmap-container" id="mindmapContainer" dir="ltr">
        <!-- SVG Element rendered by Markmap -->
        <svg id="mindmap" class="mindmap-svg" width="100%" height="100%"></svg>

        <!-- Loading Overlay -->
        <div class="state-overlay loading-overlay" id="loadingOverlay" aria-live="polite">
          <div class="spinner-box">
            <div class="spinner-ring"></div>
            <p class="spinner-text" id="spinnerText">Loading mind map...</p>
          </div>
        </div>

        <!-- Empty State (No maps found) -->
        <div class="state-overlay empty-state" id="emptyState" hidden>
          <div class="state-card">
            <div class="state-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
              </svg>
            </div>
            <h2>No Maps Found</h2>
            <p>Add <code>.md</code> files to the <code>maps/</code> folder in your repository to see them here.</p>
          </div>
        </div>

        <!-- Error State -->
        <div class="state-overlay error-state" id="errorState" hidden>
          <div class="state-card error-card">
            <div class="state-icon error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
            </div>
            <h2>Unable to Load Map</h2>
            <p id="errorMessageText">An unexpected error occurred while loading this resource.</p>
            <button type="button" class="btn-retry" id="btnRetryLoad">Retry</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Source Code Modal Panel -->
    <div class="modal-backdrop" id="sourceModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal-card">
        <header class="modal-header">
          <div class="modal-title-group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <h3 id="modalTitle">Markdown Source</h3>
          </div>
          <div class="modal-header-actions">
            <button type="button" class="btn-modal-action" id="btnCopySource">
              <svg id="copyIconDefault" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg id="copyIconSuccess" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span id="copyButtonText">Copy</span>
            </button>
            <button type="button" class="btn-icon" id="btnCloseModal" aria-label="Close Markdown source modal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </header>
        <div class="modal-body">
          <pre class="source-pre"><code id="sourceCodeBlock" class="source-code"></code></pre>
        </div>
      </div>
    </div>

  </div>

  <!-- Pinned Vendor Dependencies via jsDelivr -->
  <!-- D3.js v7.9.0 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <!-- Markmap Lib v0.18.12 -->
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>
  <!-- Markmap View v0.18.12 -->
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <!-- Markmap Toolbar v0.18.12 -->
  <script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.18.12/dist/index.js"></script>

  <!-- Main Application Logic (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
